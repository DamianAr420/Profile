<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Damian Ar - Fullstack Developer Portfolio. Twórca QuizWiz i innych aplikacji webowych."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "p") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .filter(function (s) {
              return s.slice(0, 2) === "p=";
            })[0]
            .slice(2);
          if (decoded !== l.pathname) {
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, l.pathname.length - decoded.length) +
                decoded +
                l.hash,
            );
          }
        }
      })(window.location);
    </script>
    <title>Damian Argalski | Portfolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
